<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Mehdi Rafiei — Senior Front-End Developer</title>
  <desc id="desc">A dark, technical banner with a fine grid and an animated orange signal moving through interface nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15191e" />
      <stop offset="1" stop-color="#20252b" />
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f47a08" stop-opacity=".12" />
      <stop offset=".52" stop-color="#f47a08" />
      <stop offset="1" stop-color="#ffd09e" stop-opacity=".58" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035" stroke-width="1" />
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#f47a08" stop-opacity=".2" />
      <stop offset="1" stop-color="#f47a08" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)" />
  <rect width="1200" height="300" rx="18" fill="url(#grid)" />
  <ellipse cx="948" cy="154" rx="280" ry="190" fill="url(#glow)" />
  <path d="M0 1H1200" stroke="#f47a08" stroke-opacity=".8" stroke-width="2" />

